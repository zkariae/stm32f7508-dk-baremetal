<!-- Firmware layers of stm32f7508-dk-baremetal (Z. BEN-AKKA, 11/10/2026) -->
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360"
     font-family="Atkinson, system-ui, sans-serif" font-size="14">
  <rect width="720" height="360" fill="#f7f9fb"/>

  <!-- Applications -->
  <rect x="20" y="20" width="680" height="64" rx="10" fill="#1a4fa0"/>
  <text x="360" y="47" text-anchor="middle" fill="#ffffff" font-weight="700" font-size="16">dev/apps</text>
  <text x="360" y="68" text-anchor="middle" fill="#dbe6f7">01-blink · 02-clock · 03-uart · 04 to 07 LCD · 08 / 09 bootloaders</text>

  <!-- Board -->
  <rect x="20" y="104" width="680" height="56" rx="10" fill="#eef3fb" stroke="#c9d5e4"/>
  <text x="360" y="128" text-anchor="middle" fill="#101725" font-weight="700">stm32f7508-dk/: board.h, board.c</text>
  <text x="360" y="148" text-anchor="middle" fill="#5a6674">BOARD_LED_LD1, BOARD_UART_VCP, BOARD_LCD_TIMING, LCD and QSPI pins</text>

  <!-- Generic drivers -->
  <rect x="20" y="180" width="680" height="72" rx="10" fill="#ffffff" stroke="#e3e8ee"/>
  <text x="360" y="204" text-anchor="middle" fill="#101725" font-weight="700">dev/common: generic drivers</text>
  <g fill="#1a4fa0" font-size="13">
    <text x="62"  y="234">gpio</text>
    <text x="122" y="234">led</text>
    <text x="176" y="234">uart</text>
    <text x="236" y="234">rcc</text>
    <text x="290" y="234">delay</text>
    <text x="356" y="234">ltdc</text>
    <text x="414" y="234">fb</text>
    <text x="462" y="234">qspi</text>
    <text x="522" y="234">boot</text>
    <text x="582" y="234">defines.h</text>
  </g>

  <!-- Registers -->
  <rect x="20" y="272" width="330" height="68" rx="10" fill="#ffffff" stroke="#e3e8ee"/>
  <text x="185" y="300" text-anchor="middle" fill="#101725" font-weight="700">stm32f7508-dk/: mcu.h</text>
  <text x="185" y="321" text-anchor="middle" fill="#5a6674">registers (RM0385), startup.c, linker/</text>

  <rect x="370" y="272" width="330" height="68" rx="10" fill="#101725"/>
  <text x="535" y="300" text-anchor="middle" fill="#ffffff" font-weight="700">STM32F750N8 + STM32F7508-DK</text>
  <text x="535" y="321" text-anchor="middle" fill="#c9d5e4">Cortex-M7, 64 KB flash, 16 MB QSPI, 480x272 LCD</text>
</svg>

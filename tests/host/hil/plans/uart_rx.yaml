# \file       tests/host/hil/plans/uart_rx.yaml
# \brief      UART RX test plan T1 to T4: method, parameters and expected results.
#
# \author     Z. BEN-AKKA
# \version    1.0
# \date       19/10/2026
#
# \details
#   Describes what each UART RX test sends and expects. The test procedures
#   stay in uart_tx_check.py; bench settings (port, timeouts, delays) stay in
#   config/bench.yaml. Run results are not stored here.
#   Markers are the firmware diagnostic lines, including their CRLF.
#
# \section uart_rx_yaml_version_history Version history
# | Version | Date       | Author      | Description      |
# |:-------:|:----------:|:------------|:-----------------|
# | 1.0     | 19/10/2026 | Z. BEN-AKKA | Initial version. |
# ****************************

schema_version: 1

tests:
  - id: T1
    title: Nominal reception
    method: Send printable ASCII lines with CRLF, one line at a time, and read each echo.
    params:
      line_count: 100
      chars_per_line: 128
      # Byte at (line, column) = first_char + (line * line_stride + column) % char_count
      first_char: 0x20
      char_count: 95
      line_stride: 17
      terminator: "\r\n"
    expected:
      echo: identical          # byte for byte
      markers: []
      extra_bytes: 0

  - id: T2
    title: Burst reception
    method: Send all bytes in one write while the firmware reads continuously.
    params:
      byte_count: 1000
      # Byte at index i = i & 0xFF
      pattern: index_mod_256
    expected:
      echo: identical
      markers: []
      extra_bytes: 0

  - id: T3
    title: Framing error
    method: Send one byte at a wrong baud rate, restore the bench baud rate, send a valid line.
    params:
      wrong_baud: 9600
      payload: [0x00]
      repeat: 1
      recovery_line: "RECOVERY_OK\r\n"
    expected:
      markers: ["[FE]\r\n"]
      then: recovery_line      # exact echo after the markers
      extra_bytes: 0

  - id: T4
    title: Wrong baud rate
    method: Send a burst at a wrong baud rate, restore the bench baud rate, send a valid line.
    params:
      wrong_baud: 57600
      # Bits 3 to 7 are zero: at half the bench baud rate the firmware samples
      # bit 3 as the stop bit, so each byte gives one framing error and no echo.
      payload: [0x00, 0x01, 0x02, 0x03, 0x04, 0x05, 0x06, 0x07]
      repeat: 8
      recovery_line: "RECOVERY_OK\r\n"
    expected:
      markers_any_of: ["[FE]\r\n", "[NE]\r\n"]
      min_markers: 1
      then: recovery_line      # proves the firmware is not blocked
      extra_bytes: 0

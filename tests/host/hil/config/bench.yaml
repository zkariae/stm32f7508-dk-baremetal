# \file       tests/host/hil/config/bench.yaml
# \brief      HIL bench configuration: serial port, baud rate, delays and hardware options.
#
# \author     Z. BEN-AKKA
# \version    1.1
# \date       22/10/2026
#
# \details
#   Bench-specific settings read by the host-side HIL tools. Protocol
#   constants (line length, record syntax) stay in tests/protocol.md.
#   All durations are in seconds.
#
# \section bench_yaml_version_history Version history
# | Version | Date       | Author      | Description                |
# |:-------:|:----------:|:------------|:---------------------------|
# | 1.0     | 19/10/2026 | Z. BEN-AKKA | Initial version.           |
# | 1.1     | 22/10/2026 | Z. BEN-AKKA | Refer to uart_rx_check.py. |
# ****************************

schema_version: 1

serial:                       # protocol.md section 2.1
  port: /dev/ttyACM0          # COMx on Windows
  baudrate: 115200
  bytesize: 8
  parity: none
  stopbits: 1
  flow_control: none

timeouts:                     # seconds
  startup: 5.0                # protocol.md section 8.1
  response: 2.0               # HELLO/CAPS, protocol.md section 6
  read: 2.0                   # uart_rx_check.py --timeout default

delays:                       # seconds
  port_open_settle: 0.1       # uart_rx_check.py, after opening the port
  baud_switch_settle: 0.05    # uart_rx_check.py, T3 baud switch

hardware:
  board: stm32f7508-dk
  programmer: stlink          # stlink | dfu (Makefile -flash / -dfu targets)
  firmware_target: hil-bench  # make hil-bench-flash
  instruments:
    enabled: false            # optional, plan_test_hil.md section 1

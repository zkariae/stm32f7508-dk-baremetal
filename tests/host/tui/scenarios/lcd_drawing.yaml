# ****************************
# \file       tests/host/tui/scenarios/lcd_drawing.yaml
# \brief      Scenario: draw a face with LCD_CIRCLE and LCD_LINE, read pixels back, ask the operator.
#
# \author     Z. BEN-AKKA
# \version    1.0
# \date       20/11/2026
#
# \details
#   Played by the TUI in the open session (README.md section 4.5, format in
#   core/scenario.py). On a white screen: a yellow disc of radius 100 for the
#   face, two black discs of radius 10 for the eyes (LCD_CIRCLE, section
#   6.23) and a smile of two black strokes of radius 4 (LCD_LINE, section
#   6.24). LCD_PIXEL then reads an eye, the middle of the face, the bottom of
#   the smile and a corner of the screen, which must keep the white of the
#   background; the expected colours were computed from the rules of
#   sections 6.23 and 6.24. The operator confirms the face.
#
#   Values are RGB565 (section 6.12), quoted so YAML keeps them as text;
#   LCD_PIXEL answers in uppercase (section 6.19).
#
# \section tui_lcd_drawing_yaml_version_history Version history
# | Version | Date       | Author      | Description      |
# |:-------:|:----------:|:------------|:-----------------|
# | 1.0     | 20/11/2026 | Z. BEN-AKKA | Initial version. |
# ****************************

name: LCD drawing
description: Draw a yellow face with two eyes and a smile; read pixels back and confirm by eye.
steps:
  - {command: LCD_INIT}
  - {command: LCD_FILL, args: {color: "0xFFFF"}}

  # Face, eyes, then the smile in two strokes
  - {command: LCD_CIRCLE, args: {x: 240, y: 136, radius: 100, color: "0xFFE0"}}
  - {command: LCD_CIRCLE, args: {x: 205, y: 106, radius: 10, color: "0x0000"}}
  - {command: LCD_CIRCLE, args: {x: 275, y: 106, radius: 10, color: "0x0000"}}
  - {command: LCD_LINE, args: {x0: 190, y0: 160, x1: 240, y1: 185, radius: 4, color: "0x0000"}}
  - {command: LCD_LINE, args: {x0: 240, y0: 185, x1: 290, y1: 160, radius: 4, color: "0x0000"}}

  - {command: LCD_PIXEL, args: {x: 205, y: 106}, expect: {color: "0x0000"}}
  - {command: LCD_PIXEL, args: {x: 240, y: 136}, expect: {color: "0xFFE0"}}
  - {command: LCD_PIXEL, args: {x: 240, y: 185}, expect: {color: "0x0000"}}
  - {command: LCD_PIXEL, args: {x: 10, y: 10}, expect: {color: "0xFFFF"}}
  - {prompt: "Do you see a yellow face with two eyes and a smile?"}
